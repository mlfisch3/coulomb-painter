[package]
name = "coulomb-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Local benchmark of the coulomb-gpu WGSL kernel. Prints MPS, adapter, memory, and JSON summary."

[dependencies]
coulomb-core = { path = "../coulomb-core" }
coulomb-gpu = { path = "../coulomb-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
