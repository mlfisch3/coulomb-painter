# Compose builds are memory-hungry; 4 GiB is what Android Studio's own
# templates ship with in 2026 and keeps CI runners honest.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin's incremental compiler + K2 default. K2 is stable as of Kotlin 2.0.
kotlin.code.style=official

# AndroidX is not optional in AGP 8+, but stating it silences the warning
# on a fresh project.
android.useAndroidX=true
android.nonTransitiveRClass=true
